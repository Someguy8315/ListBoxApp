[project]
name = "listbox-app"
version = "0.1.0"
description = "A basic ListBox app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["wxpython"]

[tool.uv.sources]
# PyPI has no Linux wheels, but wxPython publishes per-distro builds here.
# cp314 requires Python 3.14; bump the filename when moving to 3.15+.
wxpython = [
  { url = "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp314-cp314-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]

[tool.pyrefly]
python-version = "3.13"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
